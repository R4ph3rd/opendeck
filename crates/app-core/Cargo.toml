[package]
name = "opendeck-app-core"
description = "OpenDeck application core: wires engine, library, MIDI and analysis, owns app state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
opendeck-contracts = { workspace = true, features = ["serde"] }
opendeck-media.workspace = true
opendeck-engine.workspace = true
opendeck-dsp-fx.workspace = true
opendeck-analysis.workspace = true
opendeck-library.workspace = true
opendeck-midi.workspace = true
cpal.workspace = true
crossbeam-channel.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# specta::Type derives for the DTOs defined here (src-tauri).
specta = ["dep:specta", "opendeck-contracts/specta"]

[lints]
workspace = true
