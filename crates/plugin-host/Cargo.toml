[package]
name = "opendeck-plugin-host"
description = "OpenDeck CLAP and VST3 plugin host: scanner, effect and instrument factories behind the contracts traits (ADR 0008)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# CLAP hosting through clack-host (MIT OR Apache-2.0). Pure Rust, no SDK headers.
clap = ["dep:clack-host"]
# VST3 hosting through the `vst3` bindings (MIT OR Apache-2.0, generated from
# the MIT-licensed VST 3 SDK headers). Pre-generated, no SDK checkout needed.
vst3 = ["dep:vst3"]

[dependencies]
# `serde`: PluginInfo, PluginScanEntry and the scanner protocol are JSON.
opendeck-contracts = { workspace = true, features = ["serde"] }
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clack-host = { workspace = true, optional = true }
vst3 = { workspace = true, optional = true }

[dev-dependencies]
assert_no_alloc.workspace = true

[[bin]]
name = "opendeck-plugin-scan"
path = "src/bin/opendeck-plugin-scan.rs"

[lints]
workspace = true
