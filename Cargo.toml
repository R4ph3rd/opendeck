[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
repository = "https://github.com/R4ph3rd/opendeck"
publish = false

# Versions follow docs/adr/0001-stack.md. Exact resolved versions live in Cargo.lock.
# Crates listed here but not yet used by any member are not compiled.
[workspace.dependencies]
# Internal crates
opendeck-contracts = { path = "crates/contracts" }
opendeck-media = { path = "crates/media" }
opendeck-engine = { path = "crates/engine" }
opendeck-dsp-fx = { path = "crates/dsp-fx" }
opendeck-analysis = { path = "crates/analysis" }
opendeck-library = { path = "crates/library" }
opendeck-midi = { path = "crates/midi" }
opendeck-app-core = { path = "crates/app-core" }

# Shell and IPC
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-dialog = "2"
# Release candidates: pinned exact, bumped deliberately (ADR 0001, ADR 0004).
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"

# Audio engine
cpal = "0.18"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "wav", "pcm", "aiff", "ogg", "vorbis"] }
rubato = "5"
audioadapter-buffers = "5"
signalsmith-stretch = "0.1"
rtrb = "0.4"
assert_no_alloc = "1"
atomic_float = "1"

# Analysis
rustfft = "6.4"
ebur128 = "0.1"

# Library, metadata, MIDI
# rusqlite 0.40, not 0.41: rusqlite_migration 2.6 requires ^0.40 (ADR 0005).
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
lofty = "0.25"
blake3 = "1"
quick-xml = "0.42"
rayon = "1"
crossbeam-channel = "0.5"
midir = "0.11"

# Common
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Bundled SQLite at -O0 makes the 50k-row library queries 5x slower in debug
# builds and tests; the C library has nothing to debug here.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
