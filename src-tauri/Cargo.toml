[package]
name = "opendeck-desktop"
description = "OpenDeck desktop shell (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "opendeck"

[lib]
name = "opendeck_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "opendeck"
path = "src/main.rs"

# Writes ui/src/ipc/bindings.ts without starting the app (CI: regenerate and diff).
# An example, not a bin: the Tauri bundler ships every bin target as an app binary.
[[example]]
name = "export-bindings"
path = "examples/export_bindings.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
opendeck-app-core = { workspace = true, features = ["specta"] }
opendeck-contracts = { workspace = true, features = ["specta"] }
tauri = { workspace = true, features = [] }
tauri-plugin-dialog.workspace = true
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
crossbeam-channel.workspace = true
opendeck-media.workspace = true
opendeck-plugin-host.workspace = true
serde.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
