[package]
name = "opendeck-desktop"
description = "OpenDeck desktop shell (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "opendeck"

[lib]
name = "opendeck_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "opendeck"
path = "src/main.rs"

# Writes ui/src/ipc/bindings.ts without starting the app (CI: regenerate and diff).
[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
opendeck-app-core.workspace = true
opendeck-contracts = { workspace = true, features = ["specta"] }
tauri = { workspace = true, features = [] }
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
serde.workspace = true

[lints]
workspace = true
