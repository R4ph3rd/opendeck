# cargo-deny policy (ADR 0001): permissive licences plus MPL-2.0 used unmodified.
# GPL, LGPL and AGPL are not in the allow-list, so they are denied.

[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
yanked = "warn"
# Unmaintained crates that only arrive transitively (gtk3 bindings via Tauri) are not actionable here.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

# Our own crates use `license-file = "LICENSE"` (PolyForm), which has no SPDX id.
# Workspace members with publish = false are skipped here.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
